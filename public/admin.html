<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>婚礼迎宾设计与分发控制台</title>
<style>
:root{--bg:#10131a;--card:#1a1f2b;--muted:#8b94a7;--line:#2c3445;--fg:#f4f6fb;--accent:#6ea8fe;--bad:#ff6b73;--ok:#4dd4a2;--warn:#ffc85e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:16px 22px;background:#0b0e14;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}main{padding:18px;display:grid;grid-template-columns:320px 1fr 390px;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}h1,h2,h3{margin:0 0 10px}h1{font-size:18px}h2{font-size:15px}button,input,select,textarea{font:inherit;color:var(--fg);background:#111620;border:1px solid var(--line);border-radius:8px;padding:8px}button{cursor:pointer;background:#24416f}button.secondary{background:#252b38}button.danger{background:#742b34}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}canvas{max-width:100%;background:#000;border-radius:8px}.asset{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin:6px 0}.asset img{width:72px;height:48px;object-fit:cover;border-radius:6px}.pill{display:inline-block;padding:2px 7px;border-radius:99px;background:#263044;font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}pre{white-space:pre-wrap;word-break:break-word;background:#0b0e14;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto}.device{padding:8px;border:1px solid var(--line);border-radius:10px;margin:6px 0}.error{color:var(--bad)}.okbox{border-color:var(--ok)}@media(max-width:1100px){main{grid-template-columns:1fr}}</style></head>
<body>
<header><h1>婚礼迎宾设计与分发工具</h1><span class="muted">授权 / 排期 / 屏幕组 / 原子版本</span><span class="grow"></span><input id="adminToken" style="width:220px" type="password" placeholder="管理令牌"><button id="login">保存令牌</button><a href="/display.html" target="_blank"><button type="button" class="secondary">打开 C 现场窗口</button></a></header>
<main>
<section>
<div class="card"><h2>1. 活动身份</h2><div class="grid2"><input id="couple" placeholder="新人姓名，可多语"><input id="hall" placeholder="宴会厅"></div><div class="grid2"><input id="starts" type="datetime-local"><input id="ends" type="datetime-local"></div><div class="row"><input id="retention" class="grow" type="number" value="30" title="结束后保留天数"><button id="createEvent">创建活动</button></div><select id="eventSelect" class="grow" size="7"></select></div>
<div class="card"><h2>2. 设备与屏幕组</h2><button id="createDevice">注册现场设备</button><div id="devices"></div><div class="row"><input id="groupName" placeholder="屏幕组名，如 主厅前排"><button id="createGroup">用已勾选设备建组</button></div></div>
<div class="card"><h2>3. 素材与授权</h2><input id="assetFile" type="file" accept="image/*,.ttf,.otf,.woff,.woff2"><div class="grid2"><input id="licenseHolder" placeholder="授权方/合同号"><select id="licenseScope"><option value="event">本活动</option><option value="venue">本会场框架协议</option><option value="couple">新人提供</option></select></div><div class="grid2"><input id="licenseFrom" type="date"><input id="licenseUntil" type="date"></div><button id="uploadAsset">上传素材</button><div id="assets"></div></div>
</section>
<section>
<div class="card"><h2>4. Web 编辑器（照片焦点 / 暗化层 / 字幕位置同一版本）</h2><canvas id="preview" width="960" height="540"></canvas><div class="row"><button data-pos="top">字幕顶部</button><button data-pos="middle">中部</button><button data-pos="bottom">底部</button><label><input id="fontEmbedded" type="checkbox" checked> 字体嵌入资源包</label><button id="compareFont" class="secondary">比较嵌入/现场回退</button></div><div id="fontReport" class="muted">将比较换行、字形覆盖和安全边距。</div><div class="grid2"><input id="nameZh" placeholder="中文姓名（长名字压测）"><input id="nameEn" placeholder="English / other script name"></div><div class="grid2"><input id="hallZh" placeholder="中文宴会厅"><input id="hallEn" placeholder="English hall"></div><div class="grid2"><input id="subtitleZh" placeholder="中文字幕"><input id="subtitleEn" placeholder="English subtitle"></div><div class="row"><label>暗化 <input id="darken" type="range" min="0" max="0.9" step="0.01" value="0.34"></label><label>焦点X <input id="fx" type="range" min="0" max="1" step="0.01" value="0.5"></label><label>焦点Y <input id="fy" type="range" min="0" max="1" step="0.01" value="0.5"></label></div><div class="row"><button id="stressLong">长名字</button><button id="stressMixed">多语混排</button><button id="saveDraft">保存草稿</button><button id="publishNow">发布到勾选设备/组</button><button id="schedule" class="secondary">定时发布</button><input id="scheduledAt" type="datetime-local"></div><div id="editorError" class="error"></div></div>
<div class="card"><h2>版本与回退</h2><div id="versions"></div></div>
</section>
<section>
<div class="card"><h2>5. 发布目标清单</h2><div class="muted">活动身份和设备清单会写入审计；换厅设备必须先完成可证明擦除。</div><div id="targets"></div></div>
<div class="card"><h2>6. 现场截图校对</h2><div id="proofs"></div></div>
<div class="card"><h2>7. 清理状态与操作凭据</h2><button id="runCleanup" class="secondary">按保留策略试算</button><div id="cleanup"></div><h3 style="margin-top:12px">审计日志（不含照片正文）</h3><pre id="audits"></pre></div>
</section></main>
<script type="module" src="/admin.js"></script></body></html>
