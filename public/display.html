<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VowDisplay 现场迎宾屏</title>
  <style>
    html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; color:#fff; font-family:system-ui,sans-serif; }
    #screen { width:100vw; height:100vh; display:block; }
    #hud { position:fixed; left:12px; bottom:10px; z-index:5; background:rgba(0,0,0,.58); border:1px solid rgba(255,255,255,.18); border-radius:10px; padding:8px 10px; font-size:12px; max-width:72vw; }
    #hud.hidden { display:none; }
    #toast { position:fixed; right:12px; top:12px; z-index:6; background:rgba(0,0,0,.72); border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:10px 12px; font-size:13px; max-width:40vw; }
    button { margin-left:4px; }
  </style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud" class="hidden"></div>
<div id="toast">VowDisplay 现场终端</div>
<script src="/static/render-core.js"></script>
<script src="/static/display.js"></script>
</body>
</html>
